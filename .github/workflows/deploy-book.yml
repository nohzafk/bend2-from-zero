name: Book

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages deploys through OIDC: `pages: write` publishes, `id-token: write` lets
# the runner prove which workflow is deploying.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race. Let a running one finish rather than cancelling it:
# a deploy killed halfway can leave the site serving the previous build.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The official release binary, not a runner action. peaceiris/actions-mdbook
      # is the usual choice for this, but its newest release is from 2024-04 and
      # still targets Node 20 -- deprecated on GitHub runners, so it warns today
      # and breaks later. This is three lines with no Node in it.
      #
      # Version pinned to the mdbook the book is written against, not to
      # `latest`: bump it and the local toolchain together, or the published
      # book slowly stops being the one `mdbook serve` shows.
      - name: Install mdBook
        env:
          MDBOOK_VERSION: "0.5.2"
        run: |
          curl -sSL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - run: mdbook build

      # The built book, checked before anything is published.  A relative link
      # that leaves `book/`, or a `blob/` link to a file the repository does
      # not track, fails the build here instead of shipping to a reader.
      - name: Check the book's links
        run: python3 tools/book-links.py

      # The other promise the book makes, and the one nothing else enforces:
      # that every compiler error in it is pasted from a real run, and that every
      # `$ bend x.bend` block is what that command really printed. Line numbers
      # rot silently -- add a comment line to a probe and the quote points at the
      # wrong line while every other check still passes.
      #
      # It needs a bend, so the release is pinned and checksummed the same way
      # mdbook is, and for the same reason: bump it deliberately, together with
      # the book, so a failure means the text drifted rather than that upstream
      # shipped a release overnight.
      - name: Check the book's quoted output
        env:
          BEND_VER: "2.0.20"
          BEND_SHA_LINUX_X64: "dca589832e1645500ad258d27171ed6b5a30812bcc3088c9aedf437059be41e1"
        run: |
          curl -sSL -o "$RUNNER_TEMP/bend.tgz" \
            "https://github.com/bendlang/bend/releases/download/v${BEND_VER}/bend-${BEND_VER}-linux-x64.tar.gz"
          echo "${BEND_SHA_LINUX_X64}  $RUNNER_TEMP/bend.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/bend.tgz" -C "$RUNNER_TEMP"
          python3 tools/check-quotes.py --bend "$RUNNER_TEMP/bend/bin/bend"

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
