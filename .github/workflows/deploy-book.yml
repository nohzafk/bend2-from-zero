name: Book

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages deploys through OIDC: `pages: write` publishes, `id-token: write` lets
# the runner prove which workflow is deploying.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race. Let a running one finish rather than cancelling it:
# a deploy killed halfway can leave the site serving the previous build.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Pinned to the mdbook the book is written against, not to `latest`.
      # Bump this and the local toolchain together: if CI builds with a newer
      # mdbook than `mdbook serve` does, the published book slowly stops being
      # the one you previewed.
      - uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: "0.5.2"

      - run: mdbook build

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
