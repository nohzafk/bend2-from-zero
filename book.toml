[book]
title = "Bend 2, from zero"
description = "A tutorial built by playing with Bend 2 — every concept introduced from scratch, every number measured on this machine."
authors = ["Randall"]
language = "en"
src = "src"

[output.html]
default-theme = "light"
preferred-dark-theme = "light"
git-repository-url = "https://github.com/nohzafk/bend2-from-zero"
# Without this the book assumes it lives at the domain root, which breaks the
# 404 page and anything mdbook resolves absolutely. GitHub Pages serves a
# project repo under /<repo>/, so the subpath has to be declared.
site-url = "/bend2-from-zero/"
